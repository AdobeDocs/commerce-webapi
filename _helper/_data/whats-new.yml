- description: You can now apply custom attributes in the [`addProductsToCart` mutation](https://developer.adobe.com/commerce/webapi/graphql/schema/cart/mutations/add-products)
    by specifying the `CartItemInput.custom_attributes` field and an array of key/value
    pairs.
