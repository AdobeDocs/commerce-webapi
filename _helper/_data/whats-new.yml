- description: The `ProductViewImage` type in the Catalog Service GraphQL API now
    returns custom image roles, in addition to the standard `image`, `small_image`,
    `thumbnail`, and `swatch_image` roles. Merchants can define their own roles in
    AEM Assets, and storefronts can query them to display the right image in the right
    context, such as a lifestyle shot or a size chart. See [product queries](https://developer.adobe.com/commerce/webapi/graphql/schema/catalog-service/queries/)
    for details.
