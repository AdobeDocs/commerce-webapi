- description: Documented the following Adobe Commerce as a Cloud Service updates:<br/>-
    New non-virtual orders created through REST now require a [shipping address](https://developer.adobe.com/commerce/webapi/rest/saas-integrations/order-management/#shipping-address-requirement-for-new-orders).<br/>-
    Added the [`GET /V1/customers/:customerId/balance`](https://developer.adobe.com/commerce/webapi/rest/saas-integrations/store-credit/#retrieve-a-customers-store-credit-balance)
    endpoint to retrieve a customer's store credit balance.<br/>- Added the [`asset_role_image`](https://developer.adobe.com/commerce/webapi/graphql/schema/products/interfaces/category#aem-assets-category-images)
    field to `CategoryInterface` and `CategoryTree`.<br/>- Added the `row_total` field
    to [`InvoiceItemInterface`](https://developer.adobe.com/commerce/webapi/graphql/schema/orders/interfaces/invoice-item#invoice-item-row-totals).
