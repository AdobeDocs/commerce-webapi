- description: Added multiple changes as part of the Adobe Commerce as a Cloud Service
    September release:<br/>- Added [System configuration](https://developer.adobe.com/commerce/webapi/rest/saas-integrations/system-config/),
    which covers the `/V1/system/config` REST endpoint that syncs configurations between
    Adobe Commerce as a Cloud Service environments.<br/>- Added a [storeConfig query
    example](https://developer.adobe.com/commerce/webapi/graphql/schema/store/queries/store-config#query-a-stores-persistent-cart-and-account-sharing-configuration)
    documenting the new persistent shopping cart and customer account sharing fields
    (`persistent_enabled`, `persistent_shopping_cart`, `persistent_options_wishlist`,
    `share_customer_accounts_scope`).<br/>- Updated [Email triggering through the
    REST API](https://developer.adobe.com/commerce/webapi/rest/saas-integrations/custom-email/)
    with new `PUT` and `DELETE /V1/custom-email/templates/{id}` endpoints for updating
    and deleting custom email templates.<br/>- Added [sourceAvailability query](https://developer.adobe.com/commerce/webapi/graphql/schema/products/queries/source-availability)
    documentation for reading per-source inventory availability by SKU, scoped to
    the current sales channel.<br/>- Added the [selectFreeGiftForCart mutation](https://developer.adobe.com/commerce/webapi/graphql/schema/cart/mutations/select-free-gift),
    which lets shoppers select a gift SKU when a Free Gift cart price rule requires
    a choice, including support for configurable and bundle gift products.<br/>- Added
    a `search` field to `CustomerOrdersFilterInput` on the [customer query](https://developer.adobe.com/commerce/webapi/graphql/schema/customer/queries/customer),
    letting a signed-in customer search their order history by order number, product
    name, or SKU.<br/>- Updated the [REST](https://developer.adobe.com/commerce/webapi/reference/rest/saas)
    and [GraphQL](https://developer.adobe.com/commerce/webapi/reference/graphql/saas/)
    schemas for Adobe Commerce as a Cloud Service.
