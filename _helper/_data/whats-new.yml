- description: Updated Adobe Commerce Admin documentation for the October Adobe Commerce
    as a Cloud Service release:<br/>- Updated [Bulk endpoints](https://developer.adobe.com/commerce/webapi/rest/use-rest/bulk-endpoints)
    and [API security](https://developer.adobe.com/commerce/webapi/get-started/api-security#input-limit-for-rest-endpoints)
    to explain that the Maximum Entities per Bulk Request Store Configuration setting
    controls Bulk API limits in Adobe Commerce as a Cloud Service.<br/>- Added [Catalog
    price rules](https://developer.adobe.com/commerce/webapi/rest/saas-integrations/catalog-price-rules/),
    which explains how to manage catalog price rules with REST APIs in Adobe Commerce
    as a Cloud Service.<br/>- Documented optional reCAPTCHA validation for the [initiateUpload
    mutation](https://developer.adobe.com/commerce/webapi/graphql/schema/uploads/mutations/initiate-upload#recaptcha-validation).<br/>-
    Added [Custom shipping discounts](https://developer.adobe.com/commerce/webapi/rest/saas-integrations/shipping-discounts/),
    which describes how to apply, retrieve, and remove a custom shipping discount
    on a cart with the admin REST API.<br/>- Added [Cart item custom price API](https://developer.adobe.com/commerce/webapi/rest/saas-integrations/cart-custom-price/),
    which describes how admin and integration callers can set a custom price on cart
    items.
